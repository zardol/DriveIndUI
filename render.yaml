services:
  - type: web
    name: driveindui
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_ACCESS_TOKEN
        sync: false
      - key: AI_MAX_CALLS
        value: '150'
      - key: AI_ALLOWED_ORIGINS
        value: https://zardol.github.io
